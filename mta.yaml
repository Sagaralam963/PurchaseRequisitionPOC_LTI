_schema-version: 3.3.0
ID: PurchaseRequisitionPOC
description: A simple CAP project.
version: 1.0.0
modules:
- name: PurchaseRequisitionPOC-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: PurchaseRequisitionPOC-db
  - name: PurchaseRequisitionPOC-connectivity
  - name: PurchaseRequisitionPOC-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: PurchaseRequisitionPOC-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: PurchaseRequisitionPOC-db
  parameters:
    buildpack: nodejs_buildpack
- name: PurchaseRequisitionPOC-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: srv-api
  - name: PurchaseRequisitionPOC-html5-repo-host
    parameters:
      config:
        HTML5Runtime_enabled: true
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - nspurchasereq.zip
      name: nspurchasereq
      target-path: app/
- name: nspurchasereq
  type: html5
  path: app/purchasereq
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: PurchaseRequisitionPOC-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: PurchaseRequisitionPOC-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
- name: PurchaseRequisitionPOC-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
- name: PurchaseRequisitionPOC-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
